name: p2p_transfer
description: "Secure Cross-Platform Decentralized File Sharing System"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── State & Routing ──────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

  # ── UI & Fonts ───────────────────────────────────────────────
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0

  # ── File Handling ────────────────────────────────────────────
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # ── QR & Charts ──────────────────────────────────────────────
  qr_flutter: ^4.1.0
  fl_chart: ^0.68.0

  # ── Signaling (WebSocket Client) ─────────────────────────────
  web_socket_channel: ^3.0.1

  # ── Security & Storage ───────────────────────────────────────
  flutter_secure_storage: ^9.2.4

  # ── Networking / Connectivity ────────────────────────────────
  connectivity_plus: ^6.1.4

  # ── Utilities ────────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
