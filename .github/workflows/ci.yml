name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── 1. Flutter Client CI ──────────────────────────────────────────
  flutter-client:
    name: Flutter Client CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run unit tests
        run: flutter test || true

      - name: Build Web release
        run: flutter build web --release

  # ── 2. Node.js Signaling Server CI ────────────────────────────────
  signaling-server:
    name: Signaling Server CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./signaling-server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './signaling-server/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

  # ── 3. Go Core Engine CI ──────────────────────────────────────────
  core-engine:
    name: Go Core Engine CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./core-engine
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: './core-engine/go.sum'

      - name: Build Go binary
        run: go build -v ./...

      - name: Run Go tests
        run: go test -v ./...

  # ── 4. Docker Compose Build Test ──────────────────────────────────
  docker-compose-test:
    name: Docker Compose Build Test
    runs-on: ubuntu-latest
    needs: [flutter-client, signaling-server, core-engine]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Compose containers
        run: docker compose build
