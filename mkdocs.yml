site_name: Secure P2P File Sharing System
site_description: Technical architecture documentation for the cross-platform decentralized file sharing system
site_author: Antigravity

repo_url: https://github.com/example/secure-p2p-transfer
repo_name: GitHub

theme:
  name: material
  palette:
    # Dark Mode default
    - scheme: slate
      primary: orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.def_code_bool
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - admonition

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Setup & Deployment: setup.md
  - Security Model: security.md
